<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Must track --red in src/index.css. verify:seo asserts they agree, since
         a stale theme-color shows a wrong browser chrome tint on mobile. -->
    <meta name="theme-color" content="#c32240" />

    <!--
      Fonts are self-hosted, and there is deliberately NO <link rel="stylesheet">
      to a font CDN here.

      That link was render-blocking: the browser could not paint until it had
      fetched and parsed a third-party stylesheet, which Lighthouse costed at
      600 ms. The LCP phase breakdown showed 85% of the largest paint as *render
      delay* on a hero image that had already finished downloading - the page
      held an image it was not allowed to draw.

      Montserrat v31 is a variable font, so one woff2 covers weights 400-900 and
      there is a single file to preload rather than one per weight. The @font-face
      rules live in src/fonts.css (generated by `npm run fonts`), which is
      imported by src/main.jsx and inlined into every prerendered document by
      scripts/prerender.mjs. The preload scanner finds them there, so the fonts
      start downloading with zero blocking requests.

      Only the latin subset is preloaded: it is what renders the first screenful.
      latin-ext (70 KiB) is declared with a unicode-range and loads on demand if
      a page ever needs a glyph outside basic latin.
    -->
    <link
      rel="preload"
      href="/fonts/montserrat-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />

    <!--
      Hero preload. The hero is the LCP element on the homepage, so it is
      preloaded at high priority. imagesrcset/imagesizes mirror the <picture>
      in src/pages/Home.jsx exactly - if the two disagree the browser preloads
      one file and then discovers it needed another, wasting the whole point.
      Sizes come from scripts/images.mjs; if the hero is re-processed, copy
      the new srcset here.
    -->
    <link
      rel="preload"
      as="image"
      href="/img/hero-1600.webp"
      imagesrcset="/img/hero-640.avif 640w, /img/hero-1024.avif 1024w, /img/hero-1600.avif 1600w, /img/hero-2560.avif 2560w"
      imagesizes="100vw"
      type="image/avif"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/img/logo-240.webp" fetchpriority="high" />

    <!--
      NO <title>, meta description, canonical, robots, Open Graph or Twitter
      tags here, by design.

      All per-page head metadata is generated by scripts/prerender.mjs from
      src/seo/routeMeta.js and src/seo/jsonld.js, then injected into each
      prerendered document. Every one of the 18 routes needs a different title,
      description and canonical URL, so a static copy in this file could only
      ever be right for one of them - and would silently contradict the
      generated ones, which is how duplicate metadata ships.

      `npm run build` runs the prerender, and `npm run verify:build` fails if a
      built page is missing its title, description, canonical or JSON-LD.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

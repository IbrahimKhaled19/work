<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#cc2643" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="ALNANDA Contracting is a leading Civil Defense approved fire safety partner in Egypt. Specialists in fire pumps, sprinklers, alarms, suppression, and Civil Defense compliance for over 25 years."
    />
    <meta
      name="keywords"
      content="fire safety Egypt, fire fighting systems, fire alarm systems, fire extinguisher service, sprinkler system, fire pump, NFPA 13, NFPA 20, Civil Defense approval, emergency lighting, life safety equipment"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
    <!--
      Hero preload. The hero is the LCP element on the homepage, so it is
      preloaded at high priority. imagesrcset/imagesizes mirror the <picture>
      in src/pages/Home.jsx exactly - if the two disagree the browser preloads
      one file and then discovers it needed another, wasting the whole point.
      Sizes come from scripts/images.mjs; if the hero is re-processed, copy
      the new srcset here.
    -->
    <link
      rel="preload"
      as="image"
      href="/img/hero-1600.webp"
      imagesrcset="/img/hero-640.avif 640w, /img/hero-1024.avif 1024w, /img/hero-1600.avif 1600w, /img/hero-2560.avif 2560w"
      imagesizes="100vw"
      type="image/avif"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/img/logo-240.webp" fetchpriority="high" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="ALNANDA Contracting | Fire Safety & Fire Fighting Company"
    />
    <meta
      property="og:description"
      content="Egypt's trusted Civil Defense approved partner for fire fighting and life safety systems for over 25 years. Engineer, installer, and maintainer to code."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="ALNANDA Contracting | Fire Safety & Fire Fighting Company"
    />
    <meta
      name="twitter:description"
      content="Egypt's trusted Civil Defense approved partner for fire fighting and life safety systems for over 25 years."
    />
    <title>ALNANDA Contracting | Fire Safety &amp; Fire Fighting Company</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
